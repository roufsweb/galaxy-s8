# /etc/asound.conf - Native ALSA configuration for Samsung Galaxy S8 (Exynos 8895)
# Hardware: Card 0 (Exynos8895-Madera)
# Playback: hw:0,0 (RDMA0 -> SPUS OUT0 -> SIFS1 -> UAIF4 -> MAX98506 Speaker Amplifier)
# Capture:  hw:0,9 (DMIC1 -> LHPF1 -> ASRC1IN1L -> AIF1TX -> UAIF0 -> NSRC0 -> SPUM ASRC1 -> SIFM0 -> WDMA1)

pcm.!default {
    type asym
    playback.pcm {
        type plug
        slave.pcm "hw:0,0"
    }
    capture.pcm {
        type plug
        slave.pcm "hw:0,9"
    }
}

ctl.!default {
    type hw
    card 0
}
