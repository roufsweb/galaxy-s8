name: S8 Imager Desktop CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate-desktop:
    name: Production-Grade Vibe Coding Validation
    runs-on: windows-latest

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop-app/requirements.txt
          pip install playwright
          playwright install chromium

      - name: Run Privacy & Secret Hygiene Guard
        run: python scripts/sanitize_repo.py

      - name: Run Static Code Compilation
        run: python -m compileall -q desktop-app/app desktop-app/tests

      - name: Run Layer 1 & 2 Unit & Integration Tests
        run: python -m unittest discover -s desktop-app/tests -p "test_unit_*.py" -v

      - name: Run Layer 2 REST API Contract Tests
        run: python -m unittest desktop-app/tests/test_integration_api.py -v

      - name: Run Layer 3 Agentic E2E Human-Flow Tests (Playwright)
        run: python -m unittest desktop-app/tests/test_e2e_human_flow.py -v

      - name: Run Layer 4 Performance & Latency Budgets
        run: python -m unittest desktop-app/tests/test_performance_budget.py -v

